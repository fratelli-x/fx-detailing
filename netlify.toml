# Old ceramic offer landers. Send them to the current ceramic page.
# Do not redirect /ceramic/ itself, and do not send any new URL back to /pages/.
[[redirects]]
  from = "/pages/premium-ceramic-offer"
  to = "/ceramic/"
  status = 301

[[redirects]]
  from = "/pages/new-car-ceramic-offer"
  to = "/ceramic/"
  status = 301

# Suggested hub URL. The real ceramic page stays at /ceramic/.
[[redirects]]
  from = "/services/ceramic-coating"
  to = "/ceramic/"
  status = 301

# Canonical host is set in the Netlify dashboard, not in the repo.
# Repo host rules loop with that setting.

# Asset filenames are not content-hashed, so cache for a week and then revalidate.
# HTML stays fresh. Put the asset rules before /* so the catch-all does not win first.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

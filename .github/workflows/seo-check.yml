name: FX Detailing SEO & Link Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-fx-seo:
    name: Build & Validate FX Detailing SEO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate sitemap
        run: node scripts/generate-sitemap.js
      - name: Validate SEO
        run: |
          if [ -f package.json ]; then
            npm run validate:seo
          else
            node scripts/validate-seo.js && node scripts/validate-schema-relations.js
          fi
